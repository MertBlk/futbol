<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Futbol Maç Simülatörü</title>
    <style>
        /* Önceki tüm CSS kodları + yeni canvas stilleri */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .team-selection {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 30px;
            align-items: center;
            margin-bottom: 40px;
        }

        .team-input {
            text-align: center;
        }

        .team-input label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .team-input input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: center;
            transition: border-color 0.3s;
        }

        .team-input input:focus {
            outline: none;
            border-color: #28a745;
        }

        .vs-divider {
            font-size: 2rem;
            font-weight: bold;
            color: #666;
            text-align: center;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .season-select {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #28a745;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            display: none;
        }

        /* Canvas Styles */
        .canvas-container {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 20px;
            padding: 25px;
            margin: 30px 0;
            text-align: center;
            color: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .canvas-header h3 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #fff;
        }

        #footballCanvas {
            border: 4px solid #fff;
            border-radius: 15px;
            background: linear-gradient(45deg, #2e8b57, #3cb371);
            display: block;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .canvas-controls {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .canvas-controls .btn {
            padding: 12px 25px;
            font-size: 14px;
            font-weight: bold;
        }

        .canvas-controls .season-select {
            padding: 12px 15px;
            font-size: 14px;
            border-radius: 8px;
            border: none;
            background: white;
            color: #333;
        }

        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px 25px;
            margin-top: 20px;
        }

        .canvas-score {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
        }

        .canvas-time {
            font-size: 1.2rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
        }

        .results {
            display: none;
        }

        .match-result {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        .score {
            font-size: 3rem;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 20px;
        }

        .events-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .events, .stats {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
        }

        .events h3, .stats h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .event-item {
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.95rem;
        }

        .event-item:last-child {
            border-bottom: none;
        }

        @media (max-width: 768px) {
            .team-selection {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .vs-divider {
                order: -1;
            }

            .events-section {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            .header h1 {
                font-size: 2rem;
            }

            .score {
                font-size: 2rem;
            }

            #footballCanvas {
                width: 100%;
                max-width: 400px;
                height: 200px;
            }
            
            .canvas-controls {
                flex-direction: column;
                align-items: center;
            }
            
            .match-info {
                flex-direction: column;
                gap: 10px;
            }
            
            .canvas-score {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ Futbol Maç Simülatörü</h1>
            <p>Favori takımlarınızı seçin ve gerçekçi maç simülasyonu yaşayın!</p>
        </div>

        <div class="main-content">
            <div class="team-selection">
                <div class="team-input">
                    <label for="team1">🏠 Ev Sahibi Takım</label>
                    <input type="text" id="team1" placeholder="örn: Real Madrid" value="Real Madrid">
                </div>
                
                <div class="vs-divider">VS</div>
                
                <div class="team-input">
                    <label for="team2">✈️ Deplasman Takımı</label>
                    <input type="text" id="team2" placeholder="örn: Barcelona" value="Barcelona">
                </div>
            </div>

            <div class="controls">
                <select class="season-select" id="season">
                    <option value="2024">2024 Sezonu</option>
                    <option value="2023">2023 Sezonu</option>
                    <option value="2022">2022 Sezonu</option>
                    <option value="2021">2021 Sezonu</option>
                </select>
                
                <button class="btn btn-primary" id="simulateBtn">
                    🎮 Maçı Simüle Et
                </button>
                
                <button class="btn btn-secondary" id="randomBtn">
                    🎲 Rastgele Takımlar
                </button>
            </div>

            <div class="error" id="errorMsg"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Maç simüle ediliyor... ⚽</p>
            </div>

            <!-- Canvas Container -->
            <div class="canvas-container" id="canvasContainer">
                <div class="canvas-header">
                    <h3>🎮 Canlı Maç Simülasyonu</h3>
                </div>
                <canvas id="footballCanvas" width="800" height="400"></canvas>
                <div class="canvas-controls">
                    <button class="btn btn-primary" id="startCanvasBtn">🎮 Maçı Başlat</button>
                    <button class="btn btn-secondary" id="pauseCanvasBtn">⏸️ Duraklat</button>
                    <select id="speedSelect" class="season-select">
                        <option value="1">Normal Hız</option>
                        <option value="2">Hızlı</option>
                        <option value="3">Çok Hızlı</option>
                    </select>
                </div>
                <div class="match-info">
                    <div id="canvasScore" class="canvas-score">0 - 0</div>
                    <div id="canvasTime" class="canvas-time">0'</div>
                </div>
            </div>

            <div class="results" id="results">
                <div class="match-result">
                    <div class="score" id="finalScore">Real Madrid 2 - 1 Barcelona</div>
                </div>

                <div class="events-section">
                    <div class="events">
                        <h3>📋 Maç Olayları</h3>
                        <div id="eventsList"></div>
                    </div>

                    <div class="stats">
                        <h3>📊 Maç İstatistikleri</h3>
                        <div id="statsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
console.log('🔍 JavaScript başlıyor...');

// Basit maç simülatörü
function simulateMatch(team1, team2) {
    const score1 = Math.floor(Math.random() * 4);
    const score2 = Math.floor(Math.random() * 4);
    
    const events = [
        `⚽ ${Math.floor(Math.random() * 90)}' - ${team1} gol!`,
        `⚽ ${Math.floor(Math.random() * 90)}' - ${team2} gol!`,
        `🟨 ${Math.floor(Math.random() * 90)}' - Sarı kart`,
        `🔄 ${Math.floor(Math.random() * 90)}' - Oyuncu değişikliği`
    ];
    
    return {
        score: `${team1} ${score1} - ${score2} ${team2}`,
        events: events.slice(0, Math.floor(Math.random() * 4) + 2)
    };
}

// Canvas futbol sahası
function drawField(canvas) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    
    // Zemin
    ctx.fillStyle = '#228B22';
    ctx.fillRect(0, 0, w, h);
    
    // Çizgiler
    ctx.strokeStyle = '#FFF';
    ctx.lineWidth = 3;
    
    // Dış çerçeve
    ctx.strokeRect(10, 10, w-20, h-20);
    
    // Orta çizgi
    ctx.beginPath();
    ctx.moveTo(w/2, 10);
    ctx.lineTo(w/2, h-10);
    ctx.stroke();
    
    // Orta daire
    ctx.beginPath();
    ctx.arc(w/2, h/2, 50, 0, 2*Math.PI);
    ctx.stroke();
    
    // Kaleler
    ctx.strokeRect(10, h/2-40, 30, 80);
    ctx.strokeRect(w-40, h/2-40, 30, 80);
    
    // Ceza sahaları
    ctx.strokeRect(10, h/2-80, 80, 160);
    ctx.strokeRect(w-90, h/2-80, 80, 160);
}

// Animasyonlu oyuncular
let playerPositions = [];
let ballPosition = { x: 400, y: 200 };
let animationRunning = false;

function initPlayers() {
    playerPositions = [];
    // Ev sahibi takım (mavi)
    for(let i = 0; i < 11; i++) {
        playerPositions.push({
            x: 150 + (i % 4) * 120,
            y: 100 + Math.floor(i / 4) * 100,
            color: '#0066FF',
            speed: Math.random() * 2 + 1
        });
    }
    // Deplasman takımı (kırmızı)
    for(let i = 0; i < 11; i++) {
        playerPositions.push({
            x: 500 + (i % 4) * 60,
            y: 120 + Math.floor(i / 4) * 80,
            color: '#FF0000',
            speed: Math.random() * 2 + 1
        });
    }
}

function animatePlayers() {
    const canvas = document.getElementById('footballCanvas');
    const ctx = canvas.getContext('2d');
    
    // Sahayı yeniden çiz
    drawField(canvas);
    
    // Oyuncuları hareket ettir
    playerPositions.forEach(player => {
        // Topa doğru hareket
        const dx = ballPosition.x - player.x;
        const dy = ballPosition.y - player.y;
        const distance = Math.sqrt(dx*dx + dy*dy);
        
        if(distance > 20) {
            player.x += (dx / distance) * player.speed * 0.5;
            player.y += (dy / distance) * player.speed * 0.5;
        }
        
        // Saha sınırları
        player.x = Math.max(30, Math.min(770, player.x));
        player.y = Math.max(30, Math.min(370, player.y));
        
        // Oyuncuyu çiz
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 8, 0, 2*Math.PI);
        ctx.fill();
        
        // Kenar çizgisi
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 2;
        ctx.stroke();
    });
    
    // Topu hareket ettir
    ballPosition.x += (Math.random() - 0.5) * 4;
    ballPosition.y += (Math.random() - 0.5) * 4;
    
    ballPosition.x = Math.max(20, Math.min(780, ballPosition.x));
    ballPosition.y = Math.max(20, Math.min(380, ballPosition.y));
    
    // Topu çiz
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(ballPosition.x, ballPosition.y, 6, 0, 2*Math.PI);
    ctx.fill();
    
    if(animationRunning) {
        requestAnimationFrame(animatePlayers);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    console.log('📄 DOM yüklendi');
    
    // Canvas'ı başlat
    const canvas = document.getElementById('footballCanvas');
    if(canvas) {
        drawField(canvas);
        initPlayers();
        console.log('✅ Canvas hazırlandı');
    }
    
    // Maç simülasyonu butonu
    const simulateBtn = document.getElementById('simulateBtn');
    if(simulateBtn) {
        simulateBtn.addEventListener('click', () => {
            console.log('🎮 Maç simülasyonu başladı');
            
            const team1 = document.getElementById('team1').value || 'Takım 1';
            const team2 = document.getElementById('team2').value || 'Takım 2';
            
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            
            setTimeout(() => {
                const result = simulateMatch(team1, team2);
                
                // Sonucu göster
                document.getElementById('finalScore').textContent = result.score;
                
                const eventsList = document.getElementById('eventsList');
                eventsList.innerHTML = result.events.map(event => 
                    `<div class="event-item">${event}</div>`
                ).join('');
                
                document.getElementById('results').style.display = 'block';
                document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
                
                loading.style.display = 'none';
                console.log('✅ Maç tamamlandı');
            }, 2000);
        });
    }
    
    // Canvas maçı başlat
    const startCanvasBtn = document.getElementById('startCanvasBtn');
    if(startCanvasBtn) {
        startCanvasBtn.addEventListener('click', () => {
            console.log('🎮 Canvas animasyonu başladı');
            animationRunning = true;
            initPlayers();
            animatePlayers();
            
            // Canlı skor güncellemesi
            let minute = 0;
            let homeScore = 0;
            let awayScore = 0;
            
            const scoreUpdate = setInterval(() => {
                minute++;
                document.getElementById('canvasTime').textContent = minute + "'";
                
                // Rastgele gol
                if(Math.random() < 0.02) {
                    if(Math.random() < 0.5) {
                        homeScore++;
                    } else {
                        awayScore++;
                    }
                    document.getElementById('canvasScore').textContent = `${homeScore} - ${awayScore}`;
                }
                
                if(minute >= 90) {
                    clearInterval(scoreUpdate);
                    animationRunning = false;
                    console.log('🏁 Canvas maçı bitti');
                }
            }, 1000);
        });
    }
    
    // Pause butonu
    const pauseCanvasBtn = document.getElementById('pauseCanvasBtn');
    if(pauseCanvasBtn) {
        pauseCanvasBtn.addEventListener('click', () => {
            animationRunning = !animationRunning;
            if(animationRunning) {
                animatePlayers();
                console.log('▶️ Animasyon devam ediyor');
            } else {
                console.log('⏸️ Animasyon durduruldu');
            }
        });
    }
    
    // Rastgele takımlar
    const randomBtn = document.getElementById('randomBtn');
    if(randomBtn) {
        randomBtn.addEventListener('click', () => {
            const teams = ['Real Madrid', 'Barcelona', 'Manchester City', 'Liverpool', 'Bayern Munich', 'PSG', 'Chelsea', 'Arsenal'];
            const shuffled = teams.sort(() => 0.5 - Math.random());
            
            document.getElementById('team1').value = shuffled[0];
            document.getElementById('team2').value = shuffled[1];
            
            console.log(`🎲 Rastgele: ${shuffled[0]} vs ${shuffled[1]}`);
        });
    }
    
    console.log('✅ Tüm button\'lar hazır!');
});
</script>

<script type="module" src="dist/web.js"></script>
</body>
</html>
