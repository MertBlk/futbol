<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Futbol Simülasyonu - Modern Tasarım</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e8449 0%, #27ae60 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 2rem;
            color: #1e8449;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        /* Takım Seçimi */
        .team-selection {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .team-input label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .team-input input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            transition: border-color 0.3s;
        }

        .team-input input:focus {
            outline: none;
            border-color: #27ae60;
        }

        .vs-divider {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1e8449;
        }

        /* Kontroller */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn, .season-select {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #333;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .btn:hover, .season-select:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            background: #27ae60;
            color: white;
        }

        .btn-primary:hover {
            background: #1e8449;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Maç Container */
        .match-container {
            display: block;
            margin-top: 20px;
        }

        .team-names {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .team-name {
            font-size: 1.3rem;
            font-weight: bold;
            flex: 1;
            text-align: center;
            color: #333;
        }

        .live-score {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 30px;
            color: #1e8449;
        }

        /* Oyun Layout */
        .game-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            min-height: 600px;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Zaman Paneli */
        .time-panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .match-time {
            font-size: 2rem;
            font-weight: bold;
            color: #1e8449;
            margin-bottom: 5px;
        }

        .match-status {
            font-size: 0.9rem;
            color: #666;
        }

        /* Olaylar Paneli */
        .events-panel {
            flex: 1;
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1e8449;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #27ae60;
        }

        .events-stream {
            flex: 1;
            overflow-y: auto;
        }

        .event-item {
            background: #f8f9fa;
            border-left: 4px solid #27ae60;
            border-radius: 5px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            animation: slideIn 0.3s;
        }

        .event-item.goal {
            border-left-color: #e74c3c;
            background: #ffebee;
        }

        .event-item.info {
            border-left-color: #3498db;
            background: #e3f2fd;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* İstatistikler */
        .stats-panel {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .stats-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            color: #1e8449;
            font-weight: bold;
        }

        /* Canvas Alan */
        .canvas-area {
            background: white;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        #footballCanvas {
            width: 100%;
            height: 500px;
            border: 3px solid #1e8449;
            border-radius: 8px;
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            display: block;
        }

        .canvas-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .control-button {
            padding: 10px 20px;
            background: white;
            color: #333;
            border: 2px solid #27ae60;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-button:hover {
            background: #27ae60;
            color: white;
        }

        .control-button.secondary {
            border-color: #95a5a6;
            color: #666;
        }

        .control-button.secondary:hover {
            background: #95a5a6;
            color: white;
        }

        /* Loading & Error */
        .loading {
            display: none;
            text-align: center;
            padding: 15px;
            color: white;
        }

        .error {
            background: white;
            color: #e74c3c;
            border: 2px solid #e74c3c;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            display: none;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .game-layout {
                grid-template-columns: 1fr;
            }
            
            .left-panel {
                order: 2;
            }
            
            .canvas-area {
                order: 1;
            }
        }

        @media (max-width: 768px) {
            .team-selection {
                grid-template-columns: 1fr;
            }
            
            .vs-divider {
                margin: 10px 0;
            }
            
            .team-names {
                flex-direction: column;
                gap: 10px;
            }
            
            .live-score {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ Premium Football Stadium</h1>
            <p>Favori takımlarınızı seçin ve gerçekçi maç simülasyonu yaşayın!</p>
        </div>
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
           
            
        </div>

        <div class="main-content">
            <div class="team-selection">
                <div class="team-input">
                    <label for="team1">🏠 Ev Sahibi Takım</label>
                    <input type="text" id="team1" placeholder="örn: Real Madrid" value="Real Madrid">
                </div>
                
                <div class="vs-divider">VS</div>
                
                <div class="team-input">
                    <label for="team2">✈️ Deplasman Takımı</label>
                    <input type="text" id="team2" placeholder="örn: Barcelona" value="Barcelona">
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="startMatchBtn">
                    🎮 Maçı Başlat
                </button>
                
                <button class="btn btn-secondary" id="randomBtn">
                    🎲 Rastgele Takımlar
                </button>
                
                <button class="btn btn-secondary" id="pauseBtn">
                    ⏸️ Duraklat
                </button>
                
                <select id="speedSelect" class="season-select">
                    <option value="1">Normal Hız</option>
                    <option value="2">Hızlı</option>
                    <option value="3">Çok Hızlı</option>
                </select>
            </div>

            <!-- Match container'ı değiştir -->
                        <!-- Match Container - Yatay Layout -->

            <!-- Match Container - Yatay Layout -->
            <div class="match-container" id="matchContainer">
                <!-- Üst başlık -->
                <div class="match-header">
                    <h3>�️ Canlı Maç</h3>
                    <div class="team-names">
                        <div class="team-name" id="homeTeamName">Real Madrid</div>
                        <div class="live-score" id="canvasScore">0 - 0</div>
                        <div class="team-name" id="awayTeamName">Barcelona</div>
                    </div>
                </div>

                <!-- Ana oyun alanı - yatay layout -->
                <div class="game-layout">
                    <!-- Sol Panel - Events & Stats -->
                    <div class="left-panel">
                        <!-- Zaman ve Durum -->
                        <div class="time-panel">
                            <div class="match-time" id="canvasTime">0'</div>
                            <div class="match-status" id="matchStatus">Maçı Başlatın</div>
                        </div>

                        <!-- Canlı Olaylar -->
                        <div class="events-panel">
                            <div class="panel-title">📋 Canlı Olaylar</div>
                            <div id="eventsList" class="events-stream"></div>
                        </div>

                        <!-- İstatistikler -->
                        <div class="stats-panel">
                            <div class="panel-title">📊 İstatistikler</div>
                            <div class="stats-grid">
                                <div class="stat-row">
                                    <span class="stat-label">🎯 Şutlar</span>
                                    <span class="stat-value"><span id="homeShots">0</span> - <span id="awayShots">0</span></span>
                                </div>
                                <div class="stat-row">
                                    <span class="stat-label">🏃 Hakimiyet</span>
                                    <span class="stat-value"><span id="homePossession">50</span>% - <span id="awayPossession">50</span>%</span>
                                </div>
                                <div class="stat-row">
                                    <span class="stat-label">🟨 Kartlar</span>
                                    <span class="stat-value"><span id="homeCards">0</span> - <span id="awayCards">0</span></span>
                                </div>
                                <div class="stat-row">
                                    <span class="stat-label">🚩 Kornerler</span>
                                    <span class="stat-value"><span id="homeCorners">0</span> - <span id="awayCorners">0</span></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Sağ Taraf - Canvas Alanı -->
                    <div class="canvas-area">
                        <canvas id="footballCanvas"></canvas>
                        
                        <!-- Canvas kontrolleri -->
                        <div class="canvas-controls">
                            <button class="control-button secondary" id="canvasPauseBtn">⏸️ Duraklat</button>
                            <select id="canvasSpeedSelect" class="control-button secondary">
                                <option value="1">Normal Hız</option>
                                <option value="2">2x Hızlı</option>
                                <option value="3">3x Hızlı</option>
                            </select>
                            <button class="control-button secondary" id="canvasResetBtn">🔄 Yeniden Başlat</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript logic moved to TypeScript modules in src/web.ts -->

<script type="module" src="web.js"></script>
</body>
</html>
